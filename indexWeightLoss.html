<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d97b2b">
<title>One Step Today · یک قدم امروز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#2b2733; --ink-soft:#6d6678; --card:#ffffff;
    --sky-a:#fff3e2; --sky-b:#ffe4c9;
    --accent:#c96f2e; --accent-deep:#a5561d;
    --glow:rgba(201,111,46,.14);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Atkinson Hyperlegible','Vazirmatn',system-ui,sans-serif;
    color:var(--ink);
    min-height:100vh; min-height:100dvh;
    background:linear-gradient(170deg,var(--sky-a) 0%,var(--sky-b) 100%);
    transition:background 1.2s ease;
    display:flex; flex-direction:column; align-items:center;
  }
  body.fa { font-family:'Vazirmatn',system-ui,sans-serif; }
  body.night { --ink:#f2eefa; --ink-soft:#b7aecb; --card:#332c44; }

  .wrap { width:100%; max-width:430px; padding:16px 18px 28px;
          display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }

  /* ---------- header ---------- */
  header { text-align:center; margin-bottom:2px; position:relative; }
  .clock {
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800;
    font-size:3rem; line-height:1.05; letter-spacing:-.01em;
  }
  .clock small { font-size:1.25rem; font-weight:700; color:var(--ink-soft); }
  .daypart {
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800;
    font-size:1.02rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent-deep); margin-top:1px;
  }
  body.fa .daypart { letter-spacing:.04em; }
  body.night .daypart { color:var(--accent); }
  .badges { margin-top:8px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .week-badge {
    display:inline-block;
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:700; font-size:.85rem;
    background:var(--card); color:var(--accent-deep);
    border-radius:999px; padding:6px 14px;
    box-shadow:0 6px 16px -8px rgba(60,40,20,.3);
  }
  body.night .week-badge { color:var(--accent); }

  .hdr-btn {
    position:absolute; top:2px;
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:700; font-size:.9rem;
    background:var(--card); color:var(--accent-deep);
    border:2px solid var(--accent); border-radius:999px;
    padding:6px 11px; cursor:pointer;
  }
  body.night .hdr-btn { color:var(--accent); }
  .hdr-btn:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  #langBtn { inset-inline-end:0; }
  #schedBtn { inset-inline-start:0; }
  #chartBtn { inset-inline-start:52px; }

  /* ---------- dots ---------- */
  .dots { display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin:12px 0 14px; }
  .dot { width:12px; height:12px; border-radius:50%; border:2px solid var(--accent); opacity:.45; transition:all .3s ease; }
  .dot.done { background:var(--accent); opacity:1; }
  .dot.now { opacity:1; transform:scale(1.35); box-shadow:0 0 0 5px var(--glow); }

  /* ---------- card ---------- */
  .stage { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .card {
    background:var(--card); border-radius:26px;
    padding:18px 18px 20px;
    box-shadow:0 18px 44px -18px rgba(60,40,20,.28);
    animation:rise .45s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes rise { from{opacity:0;transform:translateY(22px);} to{opacity:1;transform:none;} }
  @media (prefers-reduced-motion:reduce){
    .card{animation:none;} body{transition:none;}
    .steam,.rays,.floaty,.sparkle,.legA,.legB,.armA,.armB,.fillW,.cloud{animation:none !important;}
  }

  /* ---------- hero illustration ---------- */
  .hero {
    position:relative; width:100%;
    border-radius:18px; overflow:hidden;
    margin-bottom:12px;
    box-shadow:0 10px 26px -14px rgba(90,50,10,.35);
    background:#fff8ee;
  }
  .hero svg { display:block; width:100%; height:auto; }
  .hero.tap { cursor:pointer; }
  .nutri-chip {
    position:absolute; bottom:10px; inset-inline-end:10px;
    background:rgba(255,255,255,.94);
    border:2px solid var(--accent); border-radius:999px;
    padding:6px 13px;
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800; font-size:.82rem;
    color:var(--accent-deep); pointer-events:none;
  }

  /* SVG animations */
  .steam { animation:steamUp 2.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center bottom; opacity:0; }
  .steam.s2 { animation-delay:.9s; }
  .steam.s3 { animation-delay:1.8s; }
  @keyframes steamUp { 0%{opacity:0;transform:translateY(6px) scale(.9);} 30%{opacity:.75;} 100%{opacity:0;transform:translateY(-18px) scale(1.05);} }
  .rays { animation:spin 26s linear infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes spin { to{transform:rotate(360deg);} }
  .floaty { animation:floaty 3.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .sparkle { animation:blink 1.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .sparkle.p2 { animation-delay:.6s; } .sparkle.p3 { animation-delay:1.2s; }
  @keyframes blink { 0%,100%{opacity:.15;transform:scale(.8);} 50%{opacity:1;transform:scale(1.15);} }
  .fillW { animation:fillW 4s ease-in-out infinite; transform-box:fill-box; transform-origin:center bottom; }
  @keyframes fillW { 0%,15%{transform:scaleY(.5);} 60%,100%{transform:scaleY(1);} }
  .legA { animation:legA 
.9s ease-in-out infinite; transform-box:fill-box; transform-origin:top center; }
  .legB { animation:legB .9s ease-in-out infinite; transform-box:fill-box; transform-origin:top center; }
  @keyframes legA { 0%,100%{transform:rotate(20deg);} 50%{transform:rotate(-22deg);} }
  @keyframes legB { 0%,100%{transform:rotate(-22deg);} 50%{transform:rotate(20deg);} }
  .armA { animation:legB .9s ease-in-out infinite; transform-box:fill-box; transform-origin:top center; }
  .armB { animation:legA .9s ease-in-out infinite; transform-box:fill-box; transform-origin:top center; }
  .cloud { animation:drift 14s linear infinite; }
  .cloud.c2 { animation-delay:6s; }
  @keyframes drift { 0%{transform:translateX(-60px);} 100%{transform:translateX(460px);} }

  .when {
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:700; font-size:.8rem;
    letter-spacing:.1em; text-transform:uppercase; color:var(--accent-deep);
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
  }
  body.fa .when { letter-spacing:.02em; font-size:.9rem; }
  body.night .when { color:var(--accent); }
  .when::before { content:''; width:20px; height:3px; border-radius:2px; background:var(--accent); flex:none; }

  .task {
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800;
    font-size:clamp(1.4rem,6.2vw,1.8rem); line-height:1.16; margin-bottom:8px;
  }
  .why { font-size:.92rem; line-height:1.55; color:var(--ink-soft); margin-bottom:12px; }
  .why b { color:var(--ink); }
  .mealtxt { font-size:.95rem; line-height:1.55; color:var(--ink-soft); margin-bottom:12px; }

  .menu { list-style:none; margin:0 0 14px; }
  .menu li {
    font-size:.94rem; line-height:1.45;
    padding:8px 11px; margin-bottom:7px;
    background:var(--glow); border-radius:12px;
    border-inline-start:4px solid var(--accent);
    display:flex; align-items:center; gap:10px;
  }
  .menu li .ic { font-size:1.35rem; flex:none; }

  /* weight entry */
  .wrow { display:flex; gap:10px; margin-bottom:8px; }
  .wrow input {
    flex:1; min-width:0; font-family:inherit; font-size:1.1rem;
    padding:11px 13px; border:2px solid var(--accent); border-radius:12px;
    background:var(--card); color:var(--ink);
  }
  .wrow button {
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800; font-size:.95rem;
    border:none; border-radius:12px; padding:11px 16px; cursor:pointer;
    background:var(--accent); color:#fff;
  }
  .wsaved { font-size:.88rem; color:var(--ink-soft); margin-bottom:10px; }

  .done-btn {
    width:100%;
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800; font-size:1.25rem;
    padding:17px; border:none; border-radius:18px;
    background:var(--accent); color:#fff; cursor:pointer;
    box-shadow:0 10px 22px -8px var(--accent);
    transition:transform .12s ease;
  }
  .done-btn:active { transform:scale(.965); }
  .done-btn:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  .skip {
    display:block; width:100%; text-align:center;
    background:none; border:none; cursor:pointer;
    margin-top:11px; font-family:inherit; font-size:.92rem;
    color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px;
  }

  /* ---------- countdown ---------- */
  .next { margin-top:14px; text-align:center; font-size:.95rem; color:var(--ink-soft); line-height:1.6; }
  .next b { font-family:'Outfit','Vazirmatn',sans-serif; font-weight:700; color:var(--ink); }
  .count {
    display:inline-flex; align-items:baseline; gap:10px; margin-top:7px;
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800;
    color:var(--accent-deep); background:var(--card);
    border-radius:16px; padding:9px 18px;
    box-shadow:0 8px 20px -8px rgba(60,40,20,.35);
  }
  body.night .count { color:var(--accent); }
  .count .digits { font-size:1.75rem; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
  .count .cap { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); }
  body.fa .count .cap { letter-spacing:.02em; font-size:.82rem; }

  footer {
    margin-top:16px; text-align:center;
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:500;
    font-size:.88rem; color:var(--ink-soft);
  }

  .celebrate { text-align:center; padding:34px 10px; }
  .celebrate .big { font-size:3.2rem; margin-bottom:12px; }
  .celebrate h2 { font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800; font-size:1.8rem; margin-bottom:8px; }
  .celebrate p { color:var(--ink-soft); font-size:1rem; line-height:1.6; }

  /* ---------- welcome question (every open) ---------- */
  #welcome {
    position:fixed; inset:0; z-index:80; display:none;
    background:linear-gradient(170deg,#fff3e0 0%,#ffdfba 100%);
    align-items:center; justify-content:center; padding:22px;
  }
  #welcome.open { display:flex; }
  .wel-card {
    background:#fff; border-radius:26px; max-width:400px; width:100%;
    padding:26px 24px 28px; text-align:center;
    box-shadow:0 24px 60px -20px rgba(120,70,20,.4);
  }
  .wel-hero { border-radius:16px; overflow:hidden; margin-bottom:14px; }
  .wel-hero svg { display:block; width:100%; height:auto; }
  .wel-card h2 {
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800;
    font-size:1.28rem; line-height:1.3; color:#2b2733; margin-bottom:4px;
  }
  .wel-card .fa-q {
    font-family:'Vazirmatn',sans-serif; font-weight:600;
    font-size:1.05rem; line-height:1.6; color:#2b2733; margin-bottom:12px; direction:rtl;
  }
  .wel-card input[type=date] {
    width:100%; font-family:inherit; font-size:1.15rem;
    padding:13px; border:2px solid #d97b2b; border-radius:14px;
    background:#fff; color:#2b2733; margin-bottom:8px;
  }
  .wel-prev {
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:700; font-size:.95rem;
    color:#a5561d; min-height:1.4em; margin-bottom:12px;
  }
  .wel-card .go {
    width:100%;
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800; font-size:1.2rem;
    padding:16px; border:none; border-radius:16px;
    background:#d97b2b; color:#fff; cursor:pointer;
    box-shadow:0 10px 22px -8px #d97b2b;
  }
  .wel-card .go:active { transform:scale(.97); }

  /* ---------- nutrition sheet ---------- */
  #nutriBg {
    position:fixed; inset:0; z-index:70; background:rgba(30,20,40,.55);
    display:none; align-items:flex-end; justify-content:center;
  }
  #nutriBg.open { display:flex; }
  .nutri {
    background:var(--card); border-radius:26px 26px 0 0;
    width:100%; max-width:430px; padding:22px 20px 30px;
    animation:rise .3s ease;
  }
  .nutri h3 {
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800; font-size:1.15rem;
    margin-bottom:4px;
  }
  .nutri .sub2 { font-size:.9rem; color:var(--ink-soft); line-height:1.5; margin-bottom:14px; }
  .ntiles { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
  .ntile {
    background:var(--glow); border-radius:14px; padding:11px 6px; text-align:center;
  }
  .ntile b {
    display:block; font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800;
    font-size:1.15rem; color:var(--accent-deep);
  }
  body.night .ntile b { color:var(--accent); }
  .ntile span { font-size:.72rem; color:var(--ink-soft); }
  .nutri .approx { font-size:.78rem; color:var(--ink-soft); margin-bottom:12px; }
  .nutri .nclose {
    display:block; width:100%;
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800; font-size:1.05rem;
    padding:13px; border:none; border-radius:14px;
    background:var(--accent); color:#fff; cursor:pointer;
  }

  /* ---------- schedule modal ---------- */
  .modal-bg {
    position:fixed; inset:0; background:rgba(30,20,40,.55);
    display:none; align-items:center; justify-content:center; z-index:50;
    padding:16px;
  }
  .modal-bg.open { display:flex; }
  .modal {
    background:var(--card); border-radius:24px;
    width:100%; max-width:390px; padding:24px 20px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.5);
    max-height:88vh; overflow-y:auto;
  }
  .modal h3 { font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800; font-size:1.3rem; margin-bottom:6px; }
  .modal .hint { font-size:.88rem; color:var(--ink-soft); line-height:1.5; margin-bottom:16px; }
  .modal .opt {
    display:flex; align-items:center; gap:12px; width:100%;
    font-family:inherit; font-size:1rem; font-weight:700; color:var(--ink);
    background:var(--glow); border:2px solid var(--accent);
    border-radius:14px; padding:13px; margin-bottom:9px; cursor:pointer;
    text-align:start;
  }
  .modal .opt .ic { font-size:1.4rem; flex:none; }
  .modal .opt small { display:block; font-weight:400; font-size:.83rem; color:var(--ink-soft); }
  .pickrow { display:flex; gap:8px; margin-bottom:9px; }
  .pickrow select {
    flex:1; min-width:0; font-family:inherit; font-size:.98rem;
    padding:11px; border:2px solid var(--accent); border-radius:12px;
    background:var(--card); color:var(--ink);
  }
  .set { margin-top:14px; border-top:2px solid var(--glow); padding-top:14px; }
  .set h4 { font-family:'Outfit','Vazirmatn',sans-serif; font-weight:800; font-size:1.05rem; margin-bottom:10px; }
  .set label { display:block; font-size:.85rem; color:var(--ink-soft); margin-bottom:4px; }
  .set input {
    width:100%; font-family:inherit; font-size:.95rem;
    padding:10px 12px; border:2px solid var(--glow); border-radius:10px;
    background:var(--card); color:var(--ink); margin-bottom:10px;
  }
  .set input:focus { border-color:var(--accent); outline:none; }
  .set .togl {
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:700; font-size:.95rem;
    border:2px solid var(--accent); border-radius:999px; padding:9px 16px;
    background:var(--card); color:var(--accent-deep); cursor:pointer;
  }
  .set .togl.on { background:var(--accent); color:#fff; }
  .set .note { font-size:.78rem; color:var(--ink-soft); line-height:1.5; margin-top:6px; }
  .modal .close {
    display:block; margin:12px auto 0; background:none; border:none; cursor:pointer;
    font-family:inherit; font-size:.95rem; color:var(--ink-soft);
    text-decoration:underline; text-underline-offset:3px;
  }

  /* ---------- viewer (schedules, grocery, chart; printable) ---------- */
  #printArea {
    display:none; position:fixed; inset:0; z-index:60;
    background:#fff; color:#1c1c1c; overflow-y:auto;
    font-family:'Vazirmatn','Atkinson Hyperlegible',sans-serif;
  }
  #printArea.open { display:block; }
  #paBar {
    position:sticky; top:0; z-index:2;
    display:flex; gap:10px; align-items:center;
    background:#2b2733; padding:12px 16px;
  }
  #paBar button {
    font-family:'Outfit','Vazirmatn',sans-serif; font-weight:700; font-size:.95rem;
    border:none; border-radius:999px; padding:10px 16px; cursor:pointer;
  }
  #paPrint { background:#d97b2b; color:#fff; }
  #paClose { background:transparent; color:#fff; border:2px solid #6d6678 !important; }
  #paNote { color:#cfc8dd; font-size:.78rem; line-height:1.4; flex:1; }
  #paContent { padding:20px 16px 40px; max-width:900px; margin:0 auto; }
  #paContent h1 { font-size:1.45rem; margin-bottom:4px; }
  #paContent .sub { font-size:.9rem; color:#555; margin-bottom:14px; }
  #paContent table { width:100%; border-collapse:collapse; font-size:.85rem; margin-bottom:18px; }
  #paContent th, #paContent td { border:1px solid #999; padding:7px 8px; text-align:start; vertical-align:top; line-height:1.5; }
  #paContent th { background:#f0e7dc; font-weight:700; }
  #paContent .rules { font-size:.85rem; line-height:1.65; margin-bottom:14px; background:#faf5ec; border-inline-start:4px solid #d97b2b; padding:10px 12px; border-radius:8px; }
  #paContent .foot { font-size:.75rem; color:#666; margin-top:10px; }
  #paContent .stats { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  #paContent .stat { background:#faf5ec; border-radius:12px; padding:10px 14px; }
  #paContent .stat b { display:block; font-size:1.25rem; }
  #paContent .stat span { font-size:.78rem; color:#666; }
  #paContent svg.chart { width:100%; height:auto; background:#fffdf9; border:1px solid #e5dccc; border-radius:12px; }
  @media print {
    body { background:#fff !important; }
    .wrap, .modal-bg, #paBar, #welcome, #nutriBg { display:none !important; }
    #printArea { display:block !important; position:static; overflow:visible; }
    #paContent { padding:0; max-width:none; }
    #paContent h1 { font-size:18pt; }
    #paContent table { font-size:9pt; }
    #paContent th, #paContent td { padding:5pt 6pt; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="hdr-btn" id="schedBtn">&#128197;</button>
    <button class="hdr-btn" id="chartBtn">&#128200;</button>
    <button class="hdr-btn" id="langBtn">فارسی دری</button>
    <div class="clock" id="clock">–:––</div>
    <div class="daypart" id="daypart"></div>
    <div class="badges">
      <span class="week-badge" id="weekBadge"></span>
      <span class="week-badge" id="streakChip" style="display:none"></span>
    </div>
  </header>
  <div class="dots" id="dots" aria-label="progress"></div>
  <div class="stage" id="stage"></div>
  <footer id="footer"></footer>
</div>

<div id="welcome">
  <div class="wel-card">
    <div class="wel-hero" id="welHero"></div>
    <h2>When did you start your fat loss program?</h2>
    <div class="fa-q">برنامه کاهش وزن را از چه تاریخی شروع کردی؟</div>
    <input type="date" id="welDate">
    <div class="wel-prev" id="welPrev"></div>
    <button class="go" id="welGo">Start &middot; شروع</button>
  </div>
</div>

<div id="nutriBg">
  <div class="nutri">
    <h3 id="nTitle"></h3>
    <div class="sub2" id="nDesc"></div>
    <div class="ntiles">
      <div class="ntile"><b id="nKcal"></b><span id="nKcalL"></span></div>
      <div class="ntile"><b id="nP"></b><span id="nPL"></span></div>
      <div class="ntile"><b id="nC"></b><span id="nCL"></span></div>
      <div class="ntile"><b id="nF"></b><span id="nFL"></span></div>
    </div>
    <div class="approx" id="nApprox"></div>
    <button class="nclose" id="nClose"></button>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="mTitle"></h3>
    <div class="hint" id="mHint"></div>
    <button class="opt" id="optDay"><span class="ic">&#128196;</span><span id="optDayTxt"></span></button>
    <button class="opt" id="optWeek"><span class="ic">&#128198;</span><span id="optWeekTxt"></span></button>
    <button class="opt" id="optProg"><span class="ic">&#128467;&#65039;</span><span id="optProgTxt"></span></button>

  /* ================= program position ================= */
  function startDateObj() {
    var d = new Date(state.startDate + 'T00:00:00');
    return isNaN(d.getTime()) ? new Date() : d;
  }
  function daysSinceStart() {
    var days = Math.floor((new Date() - startDateObj()) / 86400000);
    return days < 0 ? 0 : days;
  }
  function programWeek() { var w = Math.floor(daysSinceStart() / 7) + 1; return (w > 12) ? 12 : w; }
  function programDay() { var d = daysSinceStart() + 1; return (d > 84) ? 84 : d; }
  function phaseIdx(w) { if (w<=2) return 0; if (w<=4) return 1; if (w<=8) return 2; return 3; }
  function walkMinutes(w) { if (w<=2) return 15; if (w<=4) return 25; if (w<=8) return 30; return 40; }

  /* ================= steps + persistence ================= */
  var doneFlags = [], todaysSteps = [], week = 1;
  var countTargetHour = null;

  function stepsFor(w, dow) {
    var out = [];
    for (var i = 0; i < PLAN.length; i++) {
      var s = PLAN[i];
      if (s.days && s.days.indexOf(dow) === -1) continue;
      if (s.minWeek && w < s.minWeek) continue;
      out.push(s);
    }
    out.sort(function (a, b) { return a.start - b.start; });
    return out;
  }

  function buildToday() {
    week = programWeek();
    var now = new Date();
    todaysSteps = stepsFor(week, now.getDay());
    doneFlags = [];
    for (var j = 0; j < todaysSteps.length; j++) doneFlags.push(false);
    var h = now.getHours();
    for (var k = 0; k < todaysSteps.length; k++) {
      var nextStart = 24;                       /* next step with a LATER hour */
      for (var q2 = k + 1; q2 < todaysSteps.length; q2++) {
        if (todaysSteps[q2].start > todaysSteps[k].start) { nextStart = todaysSteps[q2].start; break; }
      }
      if (h >= nextStart) doneFlags[k] = true;  /* that window has passed */
    }
    var rec = state.days[dateKey(now)];
    if (rec && rec.done) {
      for (var r = 0; r < rec.done.length; r++) {
        if (rec.done[r] < doneFlags.length) doneFlags[rec.done[r]] = true;
      }
    }
    saveToday();
  }

  function saveToday() {
    var key = dateKey(new Date());
    var done = [];
    for (var i = 0; i < doneFlags.length; i++) if (doneFlags[i]) done.push(i);
    var complete = (done.length === doneFlags.length && doneFlags.length > 0);
    state.days[key] = { done: done, total: doneFlags.length, complete: complete };
    saveState();
    return complete;
  }

  function currentIndex() {
    for (var i = 0; i < doneFlags.length; i++) if (!doneFlags[i]) return i;
    return -1;
  }

  function streakCount() {
    var c = 0, d = new Date();
    var rec = state.days[dateKey(d)];
    if (!(rec && rec.complete)) d.setDate(d.getDate() - 1);
    while (true) {
      var r = state.days[dateKey(d)];
      if (r && r.complete) { c++; d.setDate(d.getDate() - 1); } else break;
      if (c > 400) break;
    }
    return c;
  }

  /* ================= webhook ================= */
  function sendHook(type, payload) {
    if (!state.webhook) return;
    var body = { type: type, date: dateKey(new Date()), time: new Date().toTimeString().slice(0, 8) };
    for (var k in payload) body[k] = payload[k];
    try {
      fetch(state.webhook, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(body) })['catch'](function(){});
    } catch (e) {}
  }

  function markDone(idx, skipped) {
    doneFlags[idx] = true;
    sendHook(skipped ? 'step_skip' : 'step_done', { task: todaysSteps[idx].task.en });
    var complete = saveToday();
    if (complete) sendHook('day_complete', { streak: streakCount() });
    render();
  }

  /* ================= countdown ================= */
  function hmsUntil(hour) {
    var n = new Date();
    var sec = hour * 3600 - (n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds());
    if (sec <= 0) return null;
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    var str = pad(h) + ':' + pad(m) + ':' + pad(s);
    return (lang === 'fa') ? faNum(str) : str;
  }
  function secUntil(hour) {
    var n = new Date();
    return hour * 3600 - (n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds());
  }
  var RENDERING = false;
  function tickCountdown() {
    var el = document.getElementById('cd');
    if (!el || countTargetHour === null) return;
    var cap = document.getElementById('cdCap');
    var v = hmsUntil(countTargetHour);
    if (v === null) { countTargetHour = null; if (!RENDERING) render(); return; }
    el.textContent = v;
    if (cap) cap.textContent = UI[lang].capStarts;
  }

  /* ================= reminders ================= */
  function checkNotify() {
    if (!state.notif) return;
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    var n = new Date();
    var idx = currentIndex();
    if (idx < 0) return;
    var s = todaysSteps[idx];
    if (n.getHours() !== s.start || n.getMinutes() >= 3) return;
    var key = dateKey(n) + '-' + s.start;
    if (state.notified[key]) return;
    state.notified[key] = 1;
    saveState();
    var title = s.walk
      ? ((lang === 'fa') ? faNum(walkMinutes(week)) + ' دقیقه قدم بزن' : 'Walk ' + walkMinutes(week) + ' minutes')
      : s.task[lang];
    var body = s.meal ? ROT[s.meal][n.getDay()][lang] : stripTags(s.why[lang]);
    try { new Notification(title, { body: body }); } catch (e) {}
  }

  /* ================= sky ================= */
  function paintSky() {
    var h = new Date().getHours();
    var r = document.documentElement.style;
    var night = false;
    if (h >= 5 && h < 10) {

  /* ================= weight chart ================= */
  function showChart() {
    var t = UI[lang];
    var keys = [];
    for (var k in state.weights) keys.push(k);
    keys.sort();
    if (keys.length === 0) {
      openViewer('<h1>' + t.chartTitle + '</h1><div class="rules">' + t.chartEmpty + '</div>');
      return;
    }
    var start = startDateObj();
    var pts = [], minV = 1e9, maxV = -1e9, maxDay = 83;
    for (var i = 0; i < keys.length; i++) {
      var d = new Date(keys[i] + 'T00:00:00');
      var day = Math.round((d - start) / 86400000);
      if (day < 0) day = 0;
      if (day > maxDay) maxDay = day;
      var v = state.weights[keys[i]];
      if (v < minV) minV = v;
      if (v > maxV) maxV = v;
      pts.push({ day: day, v: v });
    }
    if (maxV - minV < 2) { minV -= 1; maxV += 1; }
    minV -= 0.5; maxV += 0.5;

    var W = 840, H = 380, L = 52, R = 16, T = 20, B = 40;
    function fx(dd) { return L + (dd / maxDay) * (W - L - R); }
    function fy(v) { return T + (maxV - v) / (maxV - minV) * (H - T - B); }

    var dailyPts = '', dots = '';
    for (var j = 0; j < pts.length; j++) {
      var x = fx(pts[j].day).toFixed(1), y = fy(pts[j].v).toFixed(1);
      dailyPts += x + ',' + y + ' ';
      dots += '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="#6d6678"/>';
    }

    var weeks = {};
    for (var j2 = 0; j2 < pts.length; j2++) {
      var wk = Math.floor(pts[j2].day / 7);
      if (!weeks[wk]) weeks[wk] = { sum: 0, n: 0 };
      weeks[wk].sum += pts[j2].v; weeks[wk].n++;
    }
    var wkPts = '', wkDots = '', lastAvg = null, wkKeys = [];
    for (var wkk in weeks) wkKeys.push(parseInt(wkk, 10));
    wkKeys.sort(function (a, b) { return a - b; });
    for (var q = 0; q < wkKeys.length; q++) {
      var wq = wkKeys[q];
      var avg = weeks[wq].sum / weeks[wq].n;
      lastAvg = avg;
      var xa = fx(wq * 7 + 3).toFixed(1), ya = fy(avg).toFixed(1);
      wkPts += xa + ',' + ya + ' ';
      wkDots += '<circle cx="' + xa + '" cy="' + ya + '" r="5" fill="#d97b2b"/>';
    }

    var grid = '', yl = '';
    for (var g = 0; g <= 4; g++) {
      var vv = minV + (maxV - minV) * g / 4;
      var gy = fy(vv).toFixed(1);
      grid += '<line x1="' + L + '" y1="' + gy + '" x2="' + (W - R) + '" y2="' + gy + '" stroke="#e8e0d2" stroke-width="1"/>';
      yl += '<text x="' + (L - 8) + '" y="' + (parseFloat(gy) + 4) + '" font-size="12" fill="#777" text-anchor="end">' + num(vv.toFixed(1)) + '</text>';
    }
    var xl = '';
    for (var xw = 1; xw <= Math.ceil((maxDay + 1) / 7); xw += 2) {
      var xx = fx((xw - 1) * 7 + 3).toFixed(1);
      xl += '<text x="' + xx + '" y="' + (H - 12) + '" font-size="12" fill="#777" text-anchor="middle">' + ((lang === 'fa') ? 'ه' + faNum(xw) : 'W' + xw) + '</text>';
    }

    var first = pts[0].v, last = pts[pts.length - 1].v;
    var diff = Math.round((last - first) * 10) / 10;
    var diffTxt = (diff > 0 ? '+' : '') + diff;

    var html =
      '<h1>' + t.chartTitle + '</h1>' +
      '<div class="sub">' + t.week(week, programDay(), t.phases[phaseIdx(week)]) + '</div>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + num(first) + ' ' + t.wUnit + '</b><span>' + t.stFirst + '</span></div>' +
        '<div class="stat"><b>' + num(last) + ' ' + t.wUnit + '</b><span>' + t.stLast + '</span></div>' +
        '<div class="stat"><b>' + num(diffTxt) + ' ' + t.wUnit + '</b><span>' + t.stDiff + '</span></div>' +
        (lastAvg !== null ? '<div class="stat"><b>' + num((Math.round(lastAvg * 10) / 10)) + ' ' + t.wUnit + '</b><span>' + t.stAvg + '</span></div>' : '') +
      '</div>' +
      '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
        grid + yl + xl +
        (pts.length > 1 ? '<polyline points="' + dailyPts.trim() + '" fill="none" stroke="#b7aecb" stroke-width="1.5"/>' : '') +
        dots +
        (wkKeys.length > 1 ? '<polyline points="' + wkPts.trim() + '" fill="none" stroke="#d97b2b" stroke-width="3.5" stroke-linejoin="round"/>' : '') +
        wkDots +
      '</svg>' +
      '<div class="foot">\u25CF ' + t.legDaily + ' \u00b7 <span style="color:#d97b2b">\u25CF</span> ' + t.legWeekly + '</div>';
    openViewer(html);
  }

  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('modalBg').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
  document.getElementById('optDay').addEventListener('click', showDaily);
  document.getElementById('optWeek').addEventListener('click', showWeekly);
  document.getElementById('optProg').addEventListener('click', showProgram);
  document.getElementById('optGroc').addEventListener('click', showGrocery);
  document.getElementById('optPick').addEventListener('click', showPicked);

  document.getElementById('inHook').addEventListener('change', function () {
    state.webhook = this.value.trim();
    saveState();
  });
  document.getElementById('notifBtn').addEventListener('click', function () {
    if (!('Notification' in window)) return;
    if (state.notif && Notification.permission === 'granted') {
      state.notif = false; saveState(); render(); return;
    }
    Notification.requestPermission().then(function (p) {
      state.notif = (p === 'granted');
      saveState(); render();
    });
  });

  document.getElementById('langBtn').addEventListener('click', function () {
    lang = (lang === 'en') ? 'fa' : 'en';
    state.lang = lang;
    saveState();
    render();
  });

  /* ================= welcome question — EVERY open ================= */
  function welPreviewFor(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    var days = Math.floor((new Date() - d) / 86400000);
    if (days < 0) days = 0;
    var w = Math.floor(days / 7) + 1; if (w > 12) w = 12;
    var dd = days + 1; if (dd > 84) dd = 84;
    return UI.en.welPrev(w, dd);
  }
  function showWelcome() {
    document.getElementById('welHero').innerHTML = heroSVG('welcome');
    var inp = document.getElementById('welDate');
    inp.max = dateKey(new Date());
    inp.value = state.startDate || dateKey(new Date());
    document.getElementById('welPrev').textContent = welPreviewFor(inp.value);
    document.getElementById('welcome').className = 'open';
  }
  document.getElementById('welDate').addEventListener('input', function () {
    document.getElementById('welPrev').textContent = welPreviewFor(this.value || dateKey(new Date()));
  });
  document.getElementById('welGo').addEventListener('click', function () {
    var v = document.getElementById('welDate').value || dateKey(new Date());
    state.startDate = v;
    saveState();
    document.getElementById('welcome').className = '';
    buildToday();   /* recalibrate: week, day, meals, art all follow the date */
    render();
  });

  /* ================= boot + timers ================= */
  buildToday();
  render();
  showWelcome();                       /* asks every time the page opens */
  setInterval(tickCountdown, 1000);
  setInterval(checkNotify, 30000);
  setInterval(function () {
    var n = new Date();
    if (n.getHours() === 0 && n.getMinutes() === 0) buildToday();
    var ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT')) return;
    if (document.getElementById('printArea').className === 'open') return;
    if (document.getElementById('modalBg').className.indexOf('open') !== -1) return;
    if (document.getElementById('welcome').className === 'open') return;
    if (document.getElementById('nutriBg').className === 'open') return;
    render();
  }, 60000);
})();

</script>
</body>
</html>
